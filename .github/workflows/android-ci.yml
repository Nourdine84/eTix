          if-no-files-found: ignore

  preview-emu-api34-fr:
    needs: emulator-api34-fr
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shot: [f01_ajout_virgule_fr, f02_historique_montant_fr, f03_selecteur_date_fr, f04_date_jour_mois_fr, f05_filtre_inclusif_fr, f06_historique_filtre_inclusif_fr, f07_magasins_aujourdhui_limites_fr, f08_magasins_mois_limites_fr]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: emulator-api34-fr
          path: emu
      - name: Emit api34_${{ matrix.shot }}
        run: |
          F="emu/shots/api34_${{ matrix.shot }}.png"
          if [ -f "$F" ]; then
            python3 -m pip install --quiet pillow
            python3 .github/scripts/emit_image.py "$F"
          else
            echo "::warning title=shot missing::api34_${{ matrix.shot }}"
          fi

  # Aperçu : une capture par job (limites d'annotations GitHub), lisible via l'API checks
  preview:
    needs: build
    if: always() && needs.build.outputs.shots != '' && needs.build.outputs.shots != '[]'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shot: ${{ fromJSON(needs.build.outputs.shots) }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: shots

      - name: Emit ${{ matrix.shot }}
        run: |
          python3 -m pip install --quiet pillow
          if [ -f "shots/${{ matrix.shot }}.png" ]; then
            python3 .github/scripts/emit_image.py "shots/${{ matrix.shot }}.png"
          else
            echo "::warning title=shot missing::${{ matrix.shot }}"
          fi
