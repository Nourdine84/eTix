name: Android CI (PR APK)

on:
  pull_request:
    branches: [ "dev", "main" ]
  push:
    branches: [ "dev", "feature/**", "chore/**", "fix/**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QA_KEYSTORE_B64: ${{ secrets.QA_KEYSTORE_B64 }}
      # Emplacement déterministe de debug.keystore (sinon AGP choisit ~/.config/.android)
      ANDROID_USER_HOME: /home/runner/.android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Clé de signature stable entre les runs : sans elle chaque APK CI a une signature
      # différente et l'app QA ne peut pas être mise à jour d'un lot à l'autre.
      # Recommandé : secret QA_KEYSTORE_B64 (keystore debug encodé base64, mdp "android").
      # À défaut : cache Actions (stable seulement sur une même branche).
      - name: Install QA keystore from secret
        if: env.QA_KEYSTORE_B64 != ''
        run: mkdir -p ~/.android && echo "$QA_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Restore debug keystore from cache
        id: kscache
        if: env.QA_KEYSTORE_B64 == ''
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: etix-ci-debug-keystore-v1

      - name: Build Debug + QA APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleQa --console=plain -Dorg.gradle.java.home="$JAVA_HOME" 2>&1 | tee build.log

      # Contrôles de l'APK QA : package distinct, version, empreinte du certificat
      - name: Inspect QA APK
        id: qa
        run: |
          APK=app/build/outputs/apk/qa/app-qa.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PKG=$("$BT/aapt2" dump badging "$APK" | grep -oP "^package: name='\K[^']+")
          VER=$("$BT/aapt2" dump badging "$APK" | grep -oP "versionName='\K[^']+")
          LABEL=$("$BT/aapt2" dump badging "$APK" | grep -oP "^application-label:'\K[^']+")
          CERT=$("$BT/apksigner" verify --print-certs "$APK" | grep -oP 'SHA-256 digest: \K.*' | head -1)
          NAME="eTix-QA-$VER.apk"
          mkdir -p dist && cp "$APK" "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "::notice title=APK QA::fichier=$NAME%0Apackage=$PKG%0Alabel=$LABEL%0AversionName=$VER%0Acert SHA-256=$CERT"
          DCERT=$("$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -oP 'SHA-256 digest: \K.*' | head -1)
          KS=$(ls -la ~/.android/debug.keystore 2>&1 | tr '\n' ' ')
          echo "::notice title=Keystore::cache-hit=${{ steps.kscache.outputs.cache-hit }}%0Asecret=${{ env.QA_KEYSTORE_B64 != '' }}%0AANDROID_USER_HOME=${ANDROID_USER_HOME:-unset}%0AANDROID_SDK_HOME=${ANDROID_SDK_HOME:-unset}%0A~/.android/debug.keystore: $KS%0Afound: $(find / -name debug.keystore -not -path '/proc/*' 2>/dev/null | tr '\n' ' ')"
          echo "::notice title=APK debug::package=com.etix (même que l'app installée)%0Acert SHA-256=$DCERT"

      # APK publiés dès que le build passe, même si les tests échouent ensuite
      - name: Upload QA APK (installable à côté de l'app)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.qa.outputs.name }}
          path: dist/${{ steps.qa.outputs.name }}

      - name: Upload debug APK (même package que l'app installée)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Run Unit Tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain -Dorg.gradle.java.home="$JAVA_HOME" 2>&1 | tee test.log

      # Aperçu visuel (captures Robolectric) — artefact + annotations
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore

      # Récapitulatif des tests (lisible via l'API, succès comme échec)
      - name: Report test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          rows = []
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              suite = ET.parse(f).getroot()
              for tc in suite.iter("testcase"):
                  state = "PASS"
                  if tc.find("failure") is not None or tc.find("error") is not None:
                      state = "FAIL"
                  elif tc.find("skipped") is not None:
                      state = "SKIP"
                  rows.append(f"{state} {tc.get('classname').split('.')[-1]}.{tc.get('name')} ({tc.get('time')}s)")
          print("::notice title=Tests::" + ("%0A".join(rows) if rows else "Aucun résultat de test"))
          PY

      # Remonte les erreurs Gradle/Kotlin en annotations (lisibles sans télécharger les logs)
      - name: Report build errors as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          lines = []
          for f in ("build.log", "test.log"):
              if not os.path.exists(f):
                  continue
              txt = open(f, errors="replace").read().splitlines()
              for i, l in enumerate(txt):
                  if re.match(r"^(e: |ERROR:|FAILURE:|\* What went wrong|.*error:|.*FAILED$|.*Exception)", l):
                      lines.extend(txt[i:i + (6 if "What went wrong" in l else 1)])
          seen, out = set(), []
          for l in lines:
              l = l.replace("file:///home/runner/work/eTix/eTix/", "")
              if l not in seen:
                  seen.add(l); out.append(l)
          if not out:
              out = ["Aucune ligne d'erreur reconnue"]
          chunk = 40
          for n in range(0, min(len(out), 400), chunk):
              msg = "%0A".join(x.replace("%", "%25") for x in out[n:n + chunk])
              print(f"::error title=Build errors {n // chunk + 1}::{msg}")
          PY

  # Aperçu : une capture par job (limites d'annotations GitHub), lisible via l'API checks
  preview:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shot: [01_accueil_reglages_light, 02_magasins_mois_light, 03_magasins_mois_dark, 04_magasins_vide_aujourdhui_light, 05_fiche_magasin_light, 05b_fiche_magasin_bas_light, 06_fiche_magasin_dark, 07_reglages_depuis_accueil_light]
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: shots

      - name: Emit ${{ matrix.shot }}
        run: |
          python3 -m pip install --quiet pillow
          if [ -f "shots/${{ matrix.shot }}.png" ]; then
            python3 .github/scripts/emit_image.py "shots/${{ matrix.shot }}.png"
          else
            echo "::warning title=shot missing::${{ matrix.shot }}"
          fi
