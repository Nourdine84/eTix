      - name: Aperçu ${{ matrix.group[2] }}
        if: matrix.group[2]
        run: python3 .github/scripts/emit_image.py "shots/${{ matrix.group[2] }}.png"

      - name: Aperçu ${{ matrix.group[3] }}
        if: matrix.group[3]
        run: python3 .github/scripts/emit_image.py "shots/${{ matrix.group[3] }}.png"
      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: shots

      - name: Emit ${{ matrix.shot }}
        run: |
          python3 -m pip install --quiet pillow
          if [ -f "shots/${{ matrix.shot }}.png" ]; then
            python3 .github/scripts/emit_image.py "shots/${{ matrix.shot }}.png"
          else
            echo "::warning title=shot missing::${{ matrix.shot }}"
          fi
