name: Android CI (PR APK)

on:
  pull_request:
    branches: [ "dev", "main" ]
  push:
    branches: [ "dev", "feature/**", "chore/**", "fix/**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Permissions minimales du GITHUB_TOKEN : lecture du code uniquement
    permissions:
      contents: read
    outputs:
      shots: ${{ steps.shots.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ---------------------------------------------------------------
      # Signature QA durable (voir docs/SIGNATURE_QA.md)
      # Secrets : QA_KEYSTORE_B64 (keystore PKCS12 en base64), QA_KEYSTORE_PASSWORD.
      # Variable (publique) : QA_CERT_SHA256 = empreinte attendue → tout écart bloque la publication.
      # Sans secrets : aucun APK QA publié (pas de clé de secours, pas de cache).
      # Le keystore est écrit hors du workspace, droits 600, supprimé en fin de job.
      # ---------------------------------------------------------------
      - name: Prepare QA signing
        id: signing
        env:
          QA_KEYSTORE_B64: ${{ secrets.QA_KEYSTORE_B64 }}
          QA_KEYSTORE_PASSWORD: ${{ secrets.QA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$QA_KEYSTORE_B64" ] || [ -z "$QA_KEYSTORE_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Signature QA::Secrets QA_KEYSTORE_B64 / QA_KEYSTORE_PASSWORD absents : aucun APK QA publié (voir docs/SIGNATURE_QA.md)."
            exit 0
          fi
          umask 077
          KS="$RUNNER_TEMP/etix-qa.p12"
          printf '%s' "$QA_KEYSTORE_B64" | base64 -d > "$KS"
          echo "ETIX_QA_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          ETIX_QA_KEYSTORE_PASSWORD: ${{ secrets.QA_KEYSTORE_PASSWORD }}
          ETIX_QA_SIGNING_REQUIRED: ${{ steps.signing.outputs.ready }}
        run: |
          set -o pipefail
          TASKS="assembleDebug"
          [ "${{ steps.signing.outputs.ready }}" = "true" ] && TASKS="$TASKS assembleQa"
          ./gradlew $TASKS --console=plain -Dorg.gradle.java.home="$JAVA_HOME" 2>&1 | tee build.log

      # Contrôles de l'APK QA : package, version, empreinte complète du certificat
      - name: Inspect QA APK
        id: qa
        if: steps.signing.outputs.ready == 'true'
        env:
          EXPECTED_CERT: ${{ vars.QA_CERT_SHA256 }}
        run: |
          APK=app/build/outputs/apk/qa/app-qa.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          BADGING=$("$BT/aapt2" dump badging "$APK")
          PKG=$(echo "$BADGING" | grep -oP "^package: name='\K[^']+")
          VER=$(echo "$BADGING" | grep -oP "versionName='\K[^']+")
          CODE=$(echo "$BADGING" | grep -oP "versionCode='\K[^']+")
          LABEL=$(echo "$BADGING" | grep -oP "^application-label:'\K[^']+")
          CERT=$("$BT/apksigner" verify --print-certs "$APK" | grep -oP 'SHA-256 digest: \K.*' | head -1)
          NAME="eTix-QA-$VER.apk"
          mkdir -p dist && cp "$APK" "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          PIN="non épinglée (variable QA_CERT_SHA256 absente)"
          if [ -n "$EXPECTED_CERT" ]; then
            if [ "$(echo "$EXPECTED_CERT" | tr 'A-F:' 'a-f ' | tr -d ' ')" != "$CERT" ]; then
              echo "::error title=Signature QA::Empreinte $CERT différente de QA_CERT_SHA256 : APK non publié (une mise à jour échouerait sur le téléphone)."
              exit 1
            fi
            PIN="conforme à QA_CERT_SHA256"
          fi
          echo "::notice title=APK QA::commit=$GITHUB_SHA%0Afichier=$NAME%0AapplicationId=$PKG%0Alabel=$LABEL%0AversionName=$VER%0AversionCode=$CODE%0Acert SHA-256=$CERT%0Aempreinte=$PIN"

      # APK QA publié dès que le build passe, même si les tests échouent ensuite.
      # L'APK debug (package com.etix) n'est plus publié : il ne peut pas être installé
      # sans désinstaller l'app principale.
      - name: Upload QA APK (installable à côté de l'app)
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.qa.outputs.name }}
          path: dist/${{ steps.qa.outputs.name }}

      - name: Remove QA keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/etix-qa.p12"

      - name: Run Unit Tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain -Dorg.gradle.java.home="$JAVA_HOME" 2>&1 | tee test.log

      # Aperçu visuel (captures Robolectric) — artefact + annotations
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore

      - name: List screenshots
        id: shots
        if: always()
        run: |
          LIST=$(ls app/build/screenshots/*.png 2>/dev/null | xargs -rn1 basename | sed 's/\.png$//' | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          echo "list=${LIST:-[]}" >> "$GITHUB_OUTPUT"

      # Récapitulatif des tests (lisible via l'API, succès comme échec)
      - name: Report test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          rows = []
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              suite = ET.parse(f).getroot()
              for tc in suite.iter("testcase"):
                  state = "PASS"
                  if tc.find("failure") is not None or tc.find("error") is not None:
                      state = "FAIL"
                  elif tc.find("skipped") is not None:
                      state = "SKIP"
                  rows.append(f"{state} {tc.get('classname').split('.')[-1]}.{tc.get('name')} ({tc.get('time')}s)")
          print("::notice title=Tests::" + ("%0A".join(rows) if rows else "Aucun résultat de test"))
          PY

      # Remonte les erreurs Gradle/Kotlin en annotations (lisibles sans télécharger les logs)
      - name: Report build errors as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          lines = []
          for f in ("build.log", "test.log"):
              if not os.path.exists(f):
                  continue
              txt = open(f, errors="replace").read().splitlines()
              for i, l in enumerate(txt):
                  if re.match(r"^(e: |ERROR:|FAILURE:|\* What went wrong|.*error:|.*FAILED$|.*Exception)", l):
                      lines.extend(txt[i:i + (6 if "What went wrong" in l else 1)])
          seen, out = set(), []
          for l in lines:
              l = l.replace("file:///home/runner/work/eTix/eTix/", "")
              if l not in seen:
                  seen.add(l); out.append(l)
          if not out:
              out = ["Aucune ligne d'erreur reconnue"]
          chunk = 40
          for n in range(0, min(len(out), 400), chunk):
              msg = "%0A".join(x.replace("%", "%25") for x in out[n:n + chunk])
              print(f"::error title=Build errors {n // chunk + 1}::{msg}")
          PY

  # Aperçu : une capture par job (limites d'annotations GitHub), lisible via l'API checks
  preview:
    needs: build
    if: always() && needs.build.outputs.shots != '' && needs.build.outputs.shots != '[]'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shot: ${{ fromJSON(needs.build.outputs.shots) }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: shots

      - name: Emit ${{ matrix.shot }}
        run: |
          python3 -m pip install --quiet pillow
          if [ -f "shots/${{ matrix.shot }}.png" ]; then
            python3 .github/scripts/emit_image.py "shots/${{ matrix.shot }}.png"
          else
            echo "::warning title=shot missing::${{ matrix.shot }}"
          fi
