name: Android CI (PR APK)

on:
  pull_request:
    branches: [ "dev", "main", "feature/android-v2" ]
    # « labeled » : poser le label « apercus » sur une PR relance le workflow avec les aperçus (sans commit).
    # Les autres labels ne lancent aucun job (condition « if » de chaque job).
    types: [ opened, synchronize, reopened, labeled ]
  push:
    branches: [ "dev", "feature/**", "chore/**", "fix/**" ]

jobs:
  build:
    # Labels autres que « apercus » : aucun job (tests déjà exécutés à l'ouverture / au push)
    if: github.event.action != 'labeled' || github.event.label.name == 'apercus'
    runs-on: ubuntu-latest
    # Permissions minimales du GITHUB_TOKEN : lecture du code uniquement
    permissions:
      contents: read
    outputs:
      shots: ${{ steps.shots.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ---------------------------------------------------------------
      # Signature QA durable (voir docs/SIGNATURE_QA.md)
      # Secrets : QA_KEYSTORE_B64 (keystore PKCS12 en base64), QA_KEYSTORE_PASSWORD.
      # Variable (publique) : QA_CERT_SHA256 = empreinte attendue → tout écart bloque la publication.
      # Sans secrets : aucun APK QA publié (pas de clé de secours, pas de cache).
      # Le keystore est écrit hors du workspace, droits 600, supprimé en fin de job.
      # ---------------------------------------------------------------
      - name: Prepare QA signing
        id: signing
        env:
          QA_KEYSTORE_B64: ${{ secrets.QA_KEYSTORE_B64 }}
          QA_KEYSTORE_PASSWORD: ${{ secrets.QA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$QA_KEYSTORE_B64" ] || [ -z "$QA_KEYSTORE_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Signature QA::Secrets QA_KEYSTORE_B64 / QA_KEYSTORE_PASSWORD absents : aucun APK QA publié (voir docs/SIGNATURE_QA.md)."
            exit 0
          fi
          umask 077
          KS="$RUNNER_TEMP/etix-qa.p12"
          printf '%s' "$QA_KEYSTORE_B64" | base64 -d > "$KS"
          echo "ETIX_QA_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          ETIX_QA_KEYSTORE_PASSWORD: ${{ secrets.QA_KEYSTORE_PASSWORD }}
          ETIX_QA_SIGNING_REQUIRED: ${{ steps.signing.outputs.ready }}
        run: |
          set -o pipefail
          TASKS="assembleDebug"
          [ "${{ steps.signing.outputs.ready }}" = "true" ] && TASKS="$TASKS assembleQa"
          ./gradlew $TASKS --console=plain -Dorg.gradle.java.home="$JAVA_HOME" 2>&1 | tee build.log

      # Version livrable : APK construit SANS les propriétés de test (etixVersionCodeOffset / etixVersionNameSuffix),
      # identique aux valeurs de app/build.gradle.kts. Le build « B » (+1, « -maj ») n'existe que dans les jobs émulateur.
      - name: Version livrable (contrôle)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          B=$("$BT/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | head -1)
          CODE=$(echo "$B" | grep -oP "versionCode='\K[^']+"); NAME=$(echo "$B" | grep -oP "versionName='\K[^']+")
          WCODE=$(grep -oP 'versionCode = \K[0-9]+(?= \+ versionOffset)' app/build.gradle.kts)
          WNAME=$(grep -oP 'versionName = "\K[^"]+(?=" \+)' app/build.gradle.kts)
          MSG="APK debug : versionCode=$CODE versionName=$NAME ; app/build.gradle.kts : versionCode=$WCODE versionName=$WNAME"
          if [ "$CODE" = "$WCODE" ] && [ "$NAME" = "$WNAME" ]; then echo "::notice title=Version livrable::$MSG"
          else echo "::error title=Version livrable::$MSG"; exit 1; fi

      # Lot 9 : permissions réellement déclarées par l'APK (manifeste fusionné, bibliothèques comprises).
      # CAMERA interdite : le scan passe par l'application appareil photo du système, sans autorisation.
      - name: Permissions de l'APK (contrôle)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          P=$("$BT/aapt2" dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -oP "name='\K[^']+" | sort -u)
          echo "$P"
          echo "::notice title=Permissions de l'APK::$(echo "$P" | sed ':a;N;$!ba;s/\n/%0A/g')"
          # Origine de chaque permission (rapport de fusion du manifeste) : bibliothèque qui la demande, retrait éventuel
          R=app/build/outputs/logs/manifest-merger-debug-report.txt
          if [ -f "$R" ]; then
            ORIG=$(awk '/^uses-permission#/{p=1} /^[a-z-]+#/{if($0 !~ /^uses-permission#/)p=0} p' "$R" | grep -E "^uses-permission#|ADDED from|MERGED from|REJECTED from|was tagged" | sed 's/^[[:space:]]*//' | cut -c1-200)
            echo "$ORIG"
            echo "::notice title=Origine des permissions (fusion du manifeste)::$(echo "$ORIG" | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3900)"
          fi
          for X in CAMERA INTERNET ACCESS_NETWORK_STATE; do
            if echo "$P" | grep -qx "android.permission.$X"; then
              echo "::error title=Permissions de l'APK::android.permission.$X déclarée dans l'APK final : non nécessaire aux fonctionnalités actuelles (voir AndroidManifest.xml)"
              exit 1
            fi
          done

      # Contrôles de l'APK QA : package, version, empreinte complète du certificat
      - name: Inspect QA APK
        id: qa
        if: steps.signing.outputs.ready == 'true'
        env:
          EXPECTED_CERT: ${{ vars.QA_CERT_SHA256 }}
        run: |
          APK=app/build/outputs/apk/qa/app-qa.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          BADGING=$("$BT/aapt2" dump badging "$APK")
          PKG=$(echo "$BADGING" | grep -oP "^package: name='\K[^']+")
          VER=$(echo "$BADGING" | grep -oP "versionName='\K[^']+")
          CODE=$(echo "$BADGING" | grep -oP "versionCode='\K[^']+")
          CERT=$("$BT/apksigner" verify --print-certs "$APK" | grep -oP 'SHA-256 digest: \K.*' | head -1)
          NAME="eTix-QA-$VER.apk"
          mkdir -p dist && cp "$APK" "dist/$NAME"
          FILESHA=$(sha256sum "dist/$NAME" | cut -d' ' -f1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          INFO="commit=$GITHUB_SHA%0Afichier=$NAME%0AapplicationId=$PKG%0AversionName=$VER%0AversionCode=$CODE%0Acert SHA-256=$CERT%0Afichier SHA-256=$FILESHA"
          # Publication UNIQUEMENT si l'empreinte attendue est configurée ET identique.
          if [ -z "$EXPECTED_CERT" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=APK QA construit, NON publié::QA_CERT_SHA256 non configurée (à calculer depuis la clé, docs/SIGNATURE_QA.md).%0A$INFO"
            exit 0
          fi
          NORM=$(echo "$EXPECTED_CERT" | tr 'A-F' 'a-f' | tr -d ': ')
          if [ "$NORM" != "$CERT" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::error title=APK QA construit, NON publié::Empreinte du certificat différente de QA_CERT_SHA256 (mise à jour impossible sur l'appareil).%0A$INFO"
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=APK QA publié::$INFO%0Aempreinte=conforme à QA_CERT_SHA256"

      # Publié dès que le build QA est vérifié, indépendamment du résultat des tests (rapportés séparément).
      - name: Upload QA APK (installable à côté de l'app)
        if: steps.qa.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.qa.outputs.name }}
          path: dist/${{ steps.qa.outputs.name }}

      - name: Remove QA keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/etix-qa.p12"

      - name: Run Unit Tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain -Dorg.gradle.java.home="$JAVA_HOME" 2>&1 | tee test.log

      # Aperçu visuel (captures Robolectric) — artefact + annotations
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore
          retention-days: 30

      - name: List screenshots
        id: shots
        if: always()
        run: |
          echo "list=$(python3 .github/scripts/shot_groups.py app/build/screenshots)" >> "$GITHUB_OUTPUT"
          echo "::notice title=Captures Robolectric::$(ls app/build/screenshots/*.png 2>/dev/null | wc -l) capture(s) dans l'artefact « screenshots » (30 jours). Aperçus en annotations : label « apercus » sur la PR."

      - name: Report OCR observation
        if: always()
        run: |
          if [ -f app/build/ocr-report.txt ]; then
            echo "::notice title=OCR observé::$(sed ':a;N;$!ba;s/\n/%0A/g' app/build/ocr-report.txt)"
          fi

      # Lint Android : signale les API trop récentes pour minSdk 21 (NewApi), comme HashMap.putIfAbsent (API 24)
      # qui a fait planter Android 5 au lot 8. Non bloquant : rapport en annotations.
      # Compatibilité API (minSdk 21) : toute NOUVELLE alerte NewApi / InlinedApi fait échouer le job.
      # Seules exceptions admises : celles listées ci-dessous (déjà présentes dans app/lint-baseline.xml,
      # documentées dans docs/COMPATIBILITE_ANDROID.md). Toute autre entrée NewApi/InlinedApi ajoutée à la
      # baseline fait aussi échouer le job. Les autres catégories lint restent en rapport (inchangé).
      - name: Lint NewApi (bloquant)
        if: always()
        run: |
          ./gradlew :app:lintDebug --console=plain -Dorg.gradle.java.home=$JAVA_HOME > lint.log 2>&1 || true
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          IDS = ("NewApi", "InlinedApi")
          ALLOWED = {  # (id, fichier, attribut) — docs/COMPATIBILITE_ANDROID.md
              ("NewApi", "src/main/res/values/themes.xml", "android:windowLightStatusBar"),
              ("NewApi", "src/main/res/values/themes.xml", "android:windowLightNavigationBar"),
          }
          fail = False
          base = [i for i in ET.parse("app/lint-baseline.xml").getroot().iter("issue") if i.get("id") in IDS]
          seen = set()
          for i in base:
              f = i.find("location").get("file", "?")
              key = next((k for k in ALLOWED if k[0] == i.get("id") and k[1] == f and k[2] in i.get("message", "")), None)
              if key is None:
                  fail = True
                  print(f"::error title=Lint NewApi — exception non documentée dans la baseline::{i.get('id')} {f} {i.get('message','')[:160]}")
              else:
                  seen.add(key)
          print("::notice title=Lint NewApi — exceptions documentées::" + "%0A".join(f"{k[0]} {k[1]} {k[2]}" + ("" if k in seen else " (plus présente)") for k in sorted(ALLOWED)))
          files = glob.glob("app/build/reports/lint-results-debug.xml")
          if not files:
              print("::error title=Lint NewApi::rapport lint absent : compatibilité non vérifiée (voir lint.log)")
              sys.exit(1)
          rows = []
          for i in ET.parse(files[0]).getroot().iter("issue"):
              if i.get("id") in IDS:
                  loc = i.find("location")
                  rows.append(f"{i.get('id')} {loc.get('file','?').split('/app/')[-1]}:{loc.get('line','?')} {i.get('message','')[:160]}")
          if rows:
              print(f"::error title=Lint NewApi — {len(rows)} nouvelle(s) incompatibilité(s)::" + "%0A".join(rows[:20]))
              fail = True
          else:
              print("::notice title=Lint NewApi — aucune nouvelle incompatibilité::aucun appel d'API au-delà de minSdk 21 hors exceptions documentées")
          sys.exit(1 if fail else 0)
          PY

      # Récapitulatif des tests (lisible via l'API, succès comme échec)
      - name: Report test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          rows = []
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              suite = ET.parse(f).getroot()
              for tc in suite.iter("testcase"):
                  state = "PASS"
                  if tc.find("failure") is not None or tc.find("error") is not None:
                      state = "FAIL"
                      f = tc.find("failure") if tc.find("failure") is not None else tc.find("error")
                      msg = ((f.get("message") or "") + " | " + (f.text or "").strip().split("\n")[0:6].__str__())[:900]
                      print("::error title=Échec JVM " + tc.get("name") + "::" + msg.replace("\n", " ").replace("%", "%25"))
                  elif tc.find("skipped") is not None:
                      state = "SKIP"
                  rows.append(f"{state} {tc.get('classname').split('.')[-1]}.{tc.get('name')} ({tc.get('time')}s)")
          from collections import Counter
          import re as _re
          c = Counter(r.split(" ", 1)[0] for r in rows)
          declared = sum(len(_re.findall(r"@Test\b", open(p, errors="replace").read()))
                         for p in glob.glob("app/src/test/**/*.kt", recursive=True))
          skipped = [r.split(" ", 1)[1].split(" (")[0] for r in rows if r.startswith("SKIP")]
          level = "notice" if (declared == len(rows) and c["FAIL"] == 0) else "error"
          print(f"::{level} title=Bilan tests JVM::@Test déclarés dans les sources : {declared} ; découverts par Gradle : {len(rows)} ; "
                f"exécutés : {c['PASS'] + c['FAIL']} (réussis {c['PASS']}, échecs {c['FAIL']}) ; ignorés (@Ignore) : {c['SKIP']}%0A"
                + "%0A".join("ignoré : " + n for n in skipped))
          if declared != len(rows):
              print(f"::error title=Tests JVM non découverts::{declared} @Test déclarés, {len(rows)} découverts")
              raise SystemExit(1)
          # Détail par classe (une annotation par classe : limite de 4096 caractères par annotation)
          by = {}
          for r in rows:
              by.setdefault(r.split(" ", 1)[1].split(".", 1)[0], []).append(r)
          chunk = []
          for k in sorted(by):
              block = "%0A".join(by[k])
              if chunk and len("%0A".join(chunk + [block])) > 3800:
                  print("::notice title=Tests::" + "%0A".join(chunk)); chunk = []
              chunk.append(block)
          print("::notice title=Tests::" + ("%0A".join(chunk) if chunk else "Aucun résultat de test"))
          PY

      # Remonte les erreurs Gradle/Kotlin en annotations (lisibles sans télécharger les logs)
      - name: Report build errors as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          lines = []
          for f in ("build.log", "test.log"):
              if not os.path.exists(f):
                  continue
              txt = open(f, errors="replace").read().splitlines()
              for i, l in enumerate(txt):
                  if re.match(r"^(e: |ERROR:|FAILURE:|\* What went wrong|.*error:|.*FAILED$|.*Exception)", l):
                      lines.extend(txt[i:i + (6 if "What went wrong" in l else 1)])
          seen, out = set(), []
          for l in lines:
              l = l.replace("file:///home/runner/work/eTix/eTix/", "")
              if l not in seen:
                  seen.add(l); out.append(l)
          if not out:
              out = ["Aucune ligne d'erreur reconnue"]
          chunk = 40
          for n in range(0, min(len(out), 400), chunk):
              msg = "%0A".join(x.replace("%", "%25") for x in out[n:n + chunk])
              print(f"::error title=Build errors {n // chunk + 1}::{msg}")
          PY

  # ------------------------------------------------------------------
  # Tests de bout en bout sur VRAIS émulateurs Android (données fictives).
  # Build réservé à l'émulateur : signature de développement du runner,
  # jamais publié ni présenté comme APK QA durable.
  # Un job par configuration (les aperçus d'une configuration n'attendent pas les autres).
  # API 21 = minSdk : image 64 bits non démarrée en CI (> 35 min) → image 32 bits.
  # api34-fr : émulateur en français (fr-FR) pour la saisie, les dates et les filtres.
  # ------------------------------------------------------------------
  emulator-api34:
    # Labels autres que « apercus » : aucun job (tests déjà exécutés à l'ouverture / au push)
    if: github.event.action != 'labeled' || github.event.label.name == 'apercus'
    outputs:
      groups: ${{ steps.groups.outputs.list }}
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A et B : même code, même clé de développement du runner ; B = versionCode + 1 (test de mise à jour)
      - name: Build APKs (A, B, tests, QA de développement)
        run: |
          chmod +x ./gradlew
          G="--console=plain -Dorg.gradle.java.home=$JAVA_HOME"
          ./gradlew assembleDebug assembleDebugAndroidTest assembleQa $G
          mkdir -p dist emu-out && cp app/build/outputs/apk/debug/app-debug.apk dist/app-A.apk
          ./gradlew assembleDebug -PetixVersionCodeOffset=1 -PetixVersionNameSuffix=-maj $G
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-B.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for x in A B; do
            echo "$x $("$BT/aapt2" dump badging dist/app-$x.apk | grep -oP "versionCode='\K[^']+") $("$BT/apksigner" verify --print-certs dist/app-$x.apk | grep -oP 'SHA-256 digest: \K.*' | head -1)"
          done > emu-out/update_certs.txt

      - name: Run E2E on emulator API 34
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MODE: standard
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/scripts/emulator_e2e.sh

      - name: Report
        if: always()
        run: python3 .github/scripts/emu_report.py emu-out "API 34"

      - name: Emit failure shot 1
        if: always()
        run: |
          F=$(ls emu-out/shots/*zz_echec*.png 2>/dev/null | head -1)
          if [ -n "$F" ]; then python3 -m pip install --quiet pillow && python3 .github/scripts/emit_image.py "$F"; fi

      - name: Emit failure shot 2
        if: always()
        run: |
          F=$(ls emu-out/shots/*zz_echec*.png 2>/dev/null | sed -n 2p)
          if [ -n "$F" ]; then python3 -m pip install --quiet pillow && python3 .github/scripts/emit_image.py "$F"; fi

      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-api34
          path: emu-out/
          if-no-files-found: ignore
          retention-days: 30

      # Captures complètes : artefact ci-dessus. Aperçus en annotations (groupes de 4) : label « apercus ».
      - name: Groupes d'aperçus
        id: groups
        if: always()
        run: |
          echo "list=$(python3 .github/scripts/shot_groups.py emu-out/shots)" >> "$GITHUB_OUTPUT"
          echo "::notice title=Captures émulateur (api34)::$(ls emu-out/shots/*.png 2>/dev/null | wc -l) capture(s) dans l'artefact « emulator-api34 » (30 jours). Aperçus en annotations : label « apercus » sur la PR."

      # Verdict : le job échoue si un test a échoué, si un résultat attendu manque (nombre de tests réussis
      # différent des @Test déclarés), en cas de plantage, de délai dépassé ou de mise à jour A→B non conforme.
      # Mécanisme éprouvé par le job verdict-autotest (scénarios synthétiques).
      - name: Verdict tests émulateur
        if: always()
        run: bash .github/scripts/emu_verdict.sh emu-out "api34"

  # Aperçus à la demande : seulement si la PR porte le label « apercus » (4 captures par job).
  preview-emu-api34:
    needs: emulator-api34
    if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'apercus') && needs.emulator-api34.outputs.groups != '' && needs.emulator-api34.outputs.groups != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        group: ${{ fromJSON(needs.emulator-api34.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: emulator-api34
          path: emu
      - name: Pillow
        run: python3 -m pip install --quiet pillow
      - name: Aperçu ${{ matrix.group[0] }}
        run: python3 .github/scripts/emit_image.py "emu/shots/${{ matrix.group[0] }}.png"

      - name: Aperçu ${{ matrix.group[1] }}
        if: matrix.group[1]
        run: python3 .github/scripts/emit_image.py "emu/shots/${{ matrix.group[1] }}.png"

      - name: Aperçu ${{ matrix.group[2] }}
        if: matrix.group[2]
        run: python3 .github/scripts/emit_image.py "emu/shots/${{ matrix.group[2] }}.png"

      - name: Aperçu ${{ matrix.group[3] }}
        if: matrix.group[3]
        run: python3 .github/scripts/emit_image.py "emu/shots/${{ matrix.group[3] }}.png"

  # ------------------------------------------------------------------
  # Lot 9 — scanner avec les VRAIES applications du système : ML Kit sans réseau au premier lancement (mode avion),
  # vrai sélecteur d'image et vraie application appareil photo de l'émulateur (caméra arrière « emulated »).
  # ------------------------------------------------------------------
  emulator-api34-systeme:
    # Labels autres que « apercus » : aucun job (tests déjà exécutés à l'ouverture / au push)
    if: github.event.action != 'labeled' || github.event.label.name == 'apercus'
    outputs:
      groups: ${{ steps.groups.outputs.list }}
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APKs (app, tests)
        run: |
          chmod +x ./gradlew
          G="--console=plain -Dorg.gradle.java.home=$JAVA_HOME"
          ./gradlew assembleDebug assembleDebugAndroidTest $G
          mkdir -p dist emu-out && cp app/build/outputs/apk/debug/app-debug.apk dist/app-A.apk

      - name: Run E2E on emulator API 34 (systeme)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MODE: systeme
        with:
          api-level: 34
          target: google_apis
